<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submitted Accounts | Gornoden LLC</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .portal-page {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .portal-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .portal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 50px;
    }

    .portal-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .portal-heading {
      margin-bottom: 32px;
    }

    .portal-heading h1 {
      margin-bottom: 10px;
    }

    .accounts-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
    }

    .accounts-table-wrap {
      overflow-x: auto;
    }

    .accounts-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    .accounts-table th,
    .accounts-table td {
      padding: 18px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .accounts-table th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 0.85rem;
    }

    .empty-state,
    .loading-state,
    .error-state {
      padding: 40px 24px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .portal-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="portal-page">
    <div class="portal-container">

      <div class="portal-top">
        <a href="portal.html" class="brand">
          <img src="logo-mark.png" alt="Gornoden LLC logo">
          <span>Gornoden LLC</span>
        </a>

        <div class="portal-actions">
         <a href="portal.html" class="btn btn-secondary">Back to Portal</a>
          <button id="signOutButton" class="btn btn-secondary" type="button">
            Sign Out
          </button>
        </div>
      </div>

      <div class="portal-heading">
        <p class="eyebrow">GORNODEN LLC • CLIENT PORTAL</p>
        <h1>Submitted Accounts</h1>
        <p>
          Review commercial accounts and invoices you have submitted to Gornoden LLC.
        </p>
      </div>

      <div class="accounts-card">
        <div id="accountsContent" class="loading-state">
          Loading your submitted accounts...
        </div>
      </div>

    </div>
  </main>

  <script>
    const supabaseUrl = "https://kjfcsmsnlmuvnsmqjyor.supabase.co";

    // Paste the SAME public publishable key used in portal.html below.
    const supabaseKey = "sb_publishable_jdkIp4aSZnl1BS2Fn09xPw_J-uRXufz";

    const supabaseClient = supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    async function loadAccounts() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.replace("login.html");
        return;
      }

      const { data, error } = await supabaseClient
        .from("account_submissions")
        .select(
          "id, created_at, debtor_business_name, invoice_account_number, current_reported_balance, service_requested, status"
        )
        .order("created_at", { ascending: false });

      const content = document.getElementById("accountsContent");

      if (error) {
        console.error(error);
        content.className = "error-state";
        content.textContent =
          "We could not load your submitted accounts. Please try again.";
        return;
      }

      if (!data || data.length === 0) {
        content.className = "empty-state";
        content.innerHTML = `
          <h2>No Submitted Accounts Yet</h2>
          <p>You have not submitted any accounts through the client portal yet.</p>
          <a href="Account-Intake.html" class="btn btn-primary">
            Submit an Account
          </a>
        `;
        return;
      }

      const rows = data.map(account => {
        const date = new Date(account.created_at).toLocaleDateString();

        const balance =
          account.current_reported_balance !== null
            ? Number(account.current_reported_balance).toLocaleString(
                "en-US",
                {
                  style: "currency",
                  currency: "USD"
                }
              )
            : "—";

        return `
          <tr>
            <td>${date}</td>
            <td>${escapeHtml(account.debtor_business_name || "—")}</td>
            <td>${escapeHtml(account.invoice_account_number || "—")}</td>
            <td>${balance}</td>
            <td>${escapeHtml(account.service_requested || "—")}</td>
            <td>
              <span class="status-badge">
                ${escapeHtml(account.status || "Received")}
              </span>
            </td>
          </tr>
        `;
      }).join("");

      content.className = "accounts-table-wrap";
      content.innerHTML = `
        <table class="accounts-table">
          <thead>
            <tr>
              <th>Submitted</th>
              <th>Debtor Business</th>
              <th>Invoice / Account #</th>
              <th>Balance</th>
              <th>Service</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    document
      .getElementById("signOutButton")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.replace("login.html");
      });

    loadAccounts();
  </script>
</body>
</html>
