<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submitted Accounts | Gornoden LLC</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .accounts-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .accounts-header {
      margin-bottom: 30px;
    }

    .accounts-header h1 {
      margin-bottom: 10px;
    }

    .accounts-table-wrap {
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
    }

    .accounts-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    .accounts-table th,
    .accounts-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .accounts-table th {
      font-size: 13px;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.2);
    }

    .empty-message {
      padding: 30px;
      text-align: center;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

  <main class="accounts-wrap">

    <div class="accounts-header">
      <p class="eyebrow">GORNODEN LLC • CLIENT PORTAL</p>
      <h1>Submitted Accounts</h1>
      <p>
        View commercial accounts and invoices you have submitted to Gornoden LLC.
      </p>
    </div>

    <div class="top-actions">
      <a href="portal.html" class="portal-button">Back to Portal</a>
      <a href="Account-Intake.html" class="portal-button">Submit New Account</a>
      <button id="sign-out" class="portal-button">Sign Out</button>
    </div>

    <div id="loading-message" class="empty-message">
      Loading your submitted accounts...
    </div>

    <div id="accounts-container" class="accounts-table-wrap" style="display:none;">
      <table class="accounts-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Debtor Business</th>
            <th>Account #</th>
            <th>Original Amount</th>
            <th>Current Balance</th>
            <th>Service</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="accounts-body"></tbody>
      </table>
    </div>

  </main>

  <script>
    const supabaseUrl = "https://kjfcsmsnlmuvnsmqjyor.supabase.co";

    const supabaseKey = "sb_publishable_jdkIp4aSZnl1BS2Fn09xPw_J-uRXufz";

    const supabaseClient = supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    async function loadAccounts() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.replace("login.html");
        return;
      }

      const { data, error } = await supabaseClient
        .from("account_submissions")
        .select(`
          created_at,
          debtor_business_name,
          invoice_account_number,
          original_invoice_amount,
          current_reported_balance,
          service_requested,
          status
        `)
        .order("created_at", { ascending: false });

      const loading = document.getElementById("loading-message");
      const container = document.getElementById("accounts-container");
      const body = document.getElementById("accounts-body");

      if (error) {
        console.error(error);
        loading.textContent = "Unable to load submitted accounts.";
        return;
      }

      if (!data || data.length === 0) {
        loading.textContent = "You have not submitted any accounts yet.";
        return;
      }

      loading.style.display = "none";
      container.style.display = "block";

      data.forEach((account) => {

        const row = document.createElement("tr");

        const date = account.created_at
          ? new Date(account.created_at).toLocaleDateString()
          : "—";

        const originalAmount =
          Number(account.original_invoice_amount || 0)
            .toLocaleString("en-US", {
              style: "currency",
              currency: "USD"
            });

        const currentBalance =
          Number(account.current_reported_balance || 0)
            .toLocaleString("en-US", {
              style: "currency",
              currency: "USD"
            });

        const values = [
          date,
          account.debtor_business_name || "—",
          account.invoice_account_number || "—",
          originalAmount,
          currentBalance,
          account.service_requested || "—"
        ];

        values.forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        const statusCell = document.createElement("td");
        const badge = document.createElement("span");

        badge.className = "status-badge";
        badge.textContent = account.status || "Received";

        statusCell.appendChild(badge);
        row.appendChild(statusCell);

        body.appendChild(row);
      });
    }

    document
      .getElementById("sign-out")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.replace("login.html");
      });

    loadAccounts();
  </script>

</body>
</html>
