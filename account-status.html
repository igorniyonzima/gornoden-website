<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Status | Gornoden LLC</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(34, 62, 102, 0.55), transparent 42%),
        linear-gradient(135deg, #07111f 0%, #0b1b30 55%, #081421 100%);
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .status-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .eyebrow {
      color: #d4af37;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      color: #ffffff;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .intro {
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 30px;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .portal-button {
      display: inline-block;
      padding: 11px 18px;
      background: #d4af37;
      color: #07111f;
      border: 1px solid #d4af37;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .portal-button:hover {
      opacity: 0.9;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
    }

    .status-card h2 {
      margin-top: 0;
      color: #ffffff;
    }

    .account-number {
      color: rgba(255, 255, 255, 0.7);
    }

    .status-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #d4af37;
      background: rgba(212, 175, 55, 0.08);
      font-weight: 700;
    }

    .status-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .detail-label {
      display: block;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .detail-value {
      color: #ffffff;
      font-weight: 600;
    }

    .empty-message {
      padding: 30px;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>

<body>

  <main class="status-wrap">

    <p class="eyebrow">GORNODEN LLC • CLIENT PORTAL</p>

    <h1>Account Status</h1>

    <p class="intro">
      Track the current status of commercial accounts being handled through
      Gornoden LLC.
    </p>

    <div class="top-actions">
      <a href="portal.html" class="portal-button">Back to Portal</a>
      <a href="submitted-accounts.html" class="portal-button">Submitted Accounts</a>
      <button id="sign-out" class="portal-button">Sign Out</button>
    </div>

    <div id="loading-message" class="empty-message">
      Loading account status...
    </div>

    <div id="status-container"></div>

  </main>

  <script>
    const supabaseUrl =
      "https://kjfcsmsnlmuvnsmqjyor.supabase.co";

    const supabaseKey =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZmNzbXNubG11dm5zbXFqeW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MDI5MzUsImV4cCI6MjEwNTE3ODkzNX0.WcsDWy_nR9ITYH850-LdiJOoUSQCbSZzE035tKxIWMg";

    const supabaseClient =
      window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAccountStatus() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.replace("login.html");
        return;
      }

      const { data, error } = await supabaseClient
        .from("account_submissions")
        .select(`
          created_at,
          debtor_business_name,
          invoice_account_number,
          current_reported_balance,
          service_requested,
          status
        `)
        .order("created_at", { ascending: false });

      const loading =
        document.getElementById("loading-message");

      const container =
        document.getElementById("status-container");

      if (error) {
        console.error(error);
        loading.textContent =
          "Unable to load account status.";
        return;
      }

      if (!data || data.length === 0) {
        loading.textContent =
          "You do not have any submitted accounts yet.";
        return;
      }

      loading.style.display = "none";

      data.forEach((account) => {

        const card = document.createElement("div");
        card.className = "status-card";

        const balance = Number(
          account.current_reported_balance || 0
        ).toLocaleString("en-US", {
          style: "currency",
          currency: "USD"
        });

        card.innerHTML = `
          <h2>${account.debtor_business_name || "Commercial Account"}</h2>

          <p class="account-number">
            Account # ${account.invoice_account_number || "—"}
          </p>

          <span class="status-badge">
            ${account.status || "Received"}
          </span>

          <div class="status-details">

            <div>
              <span class="detail-label">Current Balance</span>
              <span class="detail-value">${balance}</span>
            </div>

            <div>
              <span class="detail-label">Service</span>
              <span class="detail-value">
                ${account.service_requested || "—"}
              </span>
            </div>

            <div>
              <span class="detail-label">Submitted</span>
              <span class="detail-value">
                ${new Date(account.created_at).toLocaleDateString()}
              </span>
            </div>

          </div>
        `;

        container.appendChild(card);
      });
    }

    document
      .getElementById("sign-out")
      .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.replace("login.html");
      });

    loadAccountStatus();
  </script>

</body>
</html>
