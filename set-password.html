<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Client Portal | Gornoden LLC</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .portal-activation {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #07111f;
    }

    .activation-card {
      width: 100%;
      max-width: 520px;
      background: #0d1a2b;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 40px;
      text-align: center;
    }
    .activation-card h1 {
  color: #ffffff !imporrtant;
}

.activation-card > p {
  color: #d7dde7 !important;
}

.activation-card > p:first-of-type {
  color: #d4af37 !important;
}

    .activation-logo {
      width: 70px;
      margin-bottom: 18px;
    }

    .activation-card h1 {
      margin-bottom: 12px;
    }

    .activation-card p {
      margin-bottom: 25px;
      opacity: 0.85;
    }

    .activation-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #39465a;
      font-size: 16px;
    }

    .activation-card button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #07111f;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
    }
  </style>
</head>

<body>

<main class="portal-activation">
  <section class="activation-card">

    <img src="logo-mark.png"
         alt="Gornoden LLC"
         class="activation-logo">

    <p style="color: #d4af37 !important; -webkit-text-fill-color: #d4af37 !important;">GORNODEN LLC • CLIENT PORTAL</p>

    <div style="color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-size: 48px; font-weight: 700; line-height: 1.15; margin-bottom: 20px;">Activate Your Account</div>

    <p style="color: #d7dde7 !important; -webkit-text-fill-color: #d7dde7 !important;">
      Create a secure password to finish activating your
      Gornoden Client Portal account.
    </p>

    <form id="password-form">

      <input
        type="password"
        id="password"
        placeholder="Create password"
        minlength="8"
        required
      >

      <input
        type="password"
        id="confirm-password"
        placeholder="Confirm password"
        minlength="8"
        required
      >

      <button type="submit">
        Activate Client Portal
      </button>

    </form>

    <p id="message"></p>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseUrl =
    "https://kjfcsmsnlmuvmsmqjyor.supabase.co";

  /*
    We will add Gornoden's Supabase publishable key here
    in the next step.
    Never place a service_role key or database password here.
  */

  const supabaseKey = "sb_publishable_jdkIp4aSZnllBS2FnO9xPw_J-uRXufz";

  const supabaseClient =
    window.supabase.createClient(supabaseUrl, supabaseKey);

  const form = document.getElementById("password-form");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
      message.textContent = "Passwords do not match.";
      return;
    }

    message.textContent = "Activating your account...";

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) {
      message.textContent =
        "Unable to activate your account: " + error.message;
      return;
    }

    message.textContent =
      "Account activated successfully. Redirecting...";

    setTimeout(() => {
      window.location.href = "Account-Intake.html";
    }, 1200);
  });
</script>

</body>
</html>
